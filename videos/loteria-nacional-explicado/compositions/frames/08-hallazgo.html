        p.style.strokeDashoffset = `${len}`;

      const r = document.getElementById("h8-target").getBoundingClientRect();
      const offX = r.left + r.width / 2 - W / 2;
      const offY = r.top + r.height / 2 - H / 2;
      const counterX = -offX;
      const counterY = -offY;
      const maxScale = Math.min((0.88 * W) / r.width, (0.88 * H) / r.height);

      const tl = gsap.timeline({ paused: true });

        ".h8-bar",

      tl.to(

      const COUNT_DUR = 1.2;
      const s5 = { value: 0 };
