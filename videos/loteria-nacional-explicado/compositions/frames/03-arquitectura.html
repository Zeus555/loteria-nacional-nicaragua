  <script>
    (function () {
      var world = document.getElementById("arq03-world");
      var para = document.getElementById("arq03-para");

      /* ── virtual camera: single .world wrapper, single writer ── */
      var cam = { x: 0 };
      function applyCamera() {
        world.style.transform = "translate(" + cam.x + "px, 0px)";
        para.style.transform = "translate(" + cam.x * 0.25 + "px, 0px)";
      }
      applyCamera(); // seed frame 0

      /* ── svg-path-draw setup: measure, never guess ── */
      var drawEls = document.querySelectorAll(
        ".arq03-draw, .arq03-arrowpath"
      );
      drawEls.forEach(function (p) {
        var len = p.getTotalLength() * 1.05;
        p.style.strokeDasharray = String(len);
        p.style.strokeDashoffset = String(len);
      });

      var tl = gsap.timeline({ paused: true });

      /* ════ Scene 1 (0.0–2.2s) — station 1 opens ════ */
      tl.fromTo("#arq03-st1", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power1.out" }, 0);
      tl.to("#arq03-mon-frame", { strokeDashoffset: 0, duration: 0.6, ease: "power2.out" }, 0.1);
      tl.to("#arq03-mon-stand", { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" }, 0.55);
      tl.to(".arq03-mon-row", { strokeDashoffset: 0, duration: 0.45, ease: "power2.out", stagger: 0.22 }, 0.8);
      /* per-word staggered reveal */
      tl.fromTo(
        "#arq03-name1 .arq03-wd",
        { opacity: 0, y: 42 },
        { opacity: 1, y: 0, duration: 0.55, ease: "power3.out", stagger: 0.15 },
        0.35
      );
      tl.fromTo("#arq03-ribbon", { opacity: 0, y: -14 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 0.2);
      tl.fromTo("#arq03-callout1", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 1.55);

      /* ════ Scene 2 (2.2–4.6s) — pan to ARCHIVO ════ */
      tl.to(cam, { x: -1400, duration: 1.1, ease: "power2.inOut", onUpdate: applyCamera }, 2.2);
      tl.to("#arq03-arrow1 .arq03-arrowpath", { strokeDashoffset: 0, duration: 0.8, ease: "none" }, 2.25);
      tl.to("#arq03-cab-body", { strokeDashoffset: 0, duration: 0.55, ease: "power2.out" }, 3.0);
      tl.to("#arq03-cab-lines", { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" }, 3.4);
      tl.to("#arq03-cab-handles", { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" }, 3.65);
      tl.fromTo(
        "#arq03-name2 .arq03-wd",
        { opacity: 0, y: 42 },
        { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" },
        3.35
      );
      tl.fromTo("#arq03-callout2", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 3.8);

      /* ════ Scene 3 (4.6–7.0s) — pan to EXTRACCIÓN DUAL ════ */
      tl.to(cam, { x: -2800, duration: 1.1, ease: "power2.inOut", onUpdate: applyCamera }, 4.6);
      tl.to("#arq03-arrow2 .arq03-arrowpath", { strokeDashoffset: 0, duration: 0.8, ease: "none" }, 4.65);
      tl.fromTo("#arq03-gearsvg", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power1.out" }, 5.45);
      tl.fromTo(
        "#arq03-name3 .arq03-wd",
        { opacity: 0, y: 42 },
        { opacity: 1, y: 0, duration: 0.55, ease: "power3.out", stagger: 0.15 },
        5.75
      );
      tl.fromTo("#arq03-callout3", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 6.15);
      /* svg-icon-enrichment: rotation via SVG transform ATTRIBUTE (explicit center) */
      var gearA = document.getElementById("arq03-gearA");
      var gearB = document.getElementById("arq03-gearB");
      var gearState = { deg: 0 };
      tl.to(
        gearState,
        {
          deg: 150,
          duration: 6.55,
          ease: "none",
          onUpdate: function () {
            gearA.setAttribute("transform", "rotate(" + gearState.deg + " 105 105)");
            gearB.setAttribute("transform", "rotate(" + (45 - gearState.deg) + " 281 105)");
          },
        },
        5.45
      );

      /* ════ Scene 4 (7.0–9.6s) — pan to CLÚSTER RQLITE ════ */
      tl.to(cam, { x: -4200, duration: 1.1, ease: "power2.inOut", onUpdate: applyCamera }, 7.0);
      tl.to("#arq03-arrow3 .arq03-arrowpath", { strokeDashoffset: 0, duration: 0.8, ease: "none" }, 7.05);
      tl.fromTo(
        ".arq03-phone",
        { opacity: 0 },
        { opacity: 1, duration: 0.35, ease: "power1.out", stagger: 0.07 },
        7.95
      );
      /* counting-dynamic-scale: value + scale share position and ease */
      var counterEl = document.getElementById("arq03-counter");
      var countState = { value: 0 };
      tl.to(
        countState,
        {
          value: 9,
          duration: 1.2,
          ease: "power3.out",
          onUpdate: function () {
            counterEl.textContent = String(Math.round(countState.value));
          },
        },
        8.1
      );
      tl.fromTo(counterEl, { scale: 0.55, opacity: 0 }, { scale: 1, opacity: 1, duration: 1.2, ease: "power3.out" }, 8.1);
      tl.fromTo(
        "#arq03-name4 .arq03-wd",
        { opacity: 0, y: 42 },
        { opacity: 1, y: 0, duration: 0.55, ease: "power3.out", stagger: 0.15 },
        8.2
      );
      tl.fromTo("#arq03-callout4", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 9.25);
