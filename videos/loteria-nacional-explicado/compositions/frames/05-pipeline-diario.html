  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });
      window.__timelines["05-pipeline-diario"] = tl;

      var INK = "#1F2BE0";
      var INK_SOFT = "#5560E5";
      var PAPER = "#F0EBDE";

      /* ── Scene 1 (0.0–1.6s): panel + margin furniture enter; header types on ── */
      tl.fromTo("#f05-panel", { autoAlpha: 0, y: 26 }, { autoAlpha: 1, y: 0, duration: 0.55, ease: "power3.out" }, 0);
      tl.fromTo("#f05-vtitle", { autoAlpha: 0, y: 20 }, { autoAlpha: 1, y: 0, duration: 0.6, ease: "power2.out" }, 0.12);
      tl.fromTo("#f05-kicker", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.45, ease: "power1.out" }, 0.25);

      /* slow macro drift under the whole shot */
      tl.fromTo("#f05-panel", { scale: 1 }, { scale: 1.012, duration: 10, ease: "none" }, 0);

      /* type-on with context-sensitive caret (discrete-text-sequence SEQUENCE) */
      var SEQUENCE = [
        { t: 0.0, text: "", color: INK },
        { t: 0.22, text: "▶", color: INK },
        { t: 0.34, text: "▶ Ta", color: INK },
        { t: 0.46, text: "▶ Tarea", color: INK },
        { t: 0.58, text: "▶ TareaDia", color: INK },
        { t: 0.7, text: "▶ TareaDiaria", color: INK },
        { t: 0.84, text: "▶ TareaDiaria.ps1", color: INK },
        { t: 1.0, text: "▶ TareaDiaria.ps1 —", color: INK_SOFT },
        { t: 1.14, text: "▶ TareaDiaria.ps1 — 03:", color: INK_SOFT },
        { t: 1.3, text: "▶ TareaDiaria.ps1 — 03:00", color: INK_SOFT },
      ];
      function entryAt(time) {
        for (var i = SEQUENCE.length - 1; i >= 0; i--) {
          if (time >= SEQUENCE[i].t) return SEQUENCE[i];
        }
        return SEQUENCE[0];
      }
      var typeEl = document.getElementById("f05-type");
      var cursorEl = document.getElementById("f05-cursor");
      var driver = { t: 0 };
      tl.to(
        driver,
        {
          t: 1.6,
          duration: 1.6,
          ease: "none",
          onUpdate: function () {
            var e = entryAt(driver.t);
            typeEl.textContent = e.text;
            cursorEl.style.background = e.color;
          },
        },
        0
      );
      /* deterministic square-wave blink — 2 whole cycles over the typing window */
      var blink = { p: 0 };
      tl.to(
        blink,
        {
          p: Math.PI * 2 * 2,
          duration: 1.6,
          ease: "none",
          onUpdate: function () {
            cursorEl.style.opacity = Math.sin(blink.p) > 0 ? "1" : "0";
          },
        },
        0
      );
      tl.to("#f05-cursor", { autoAlpha: 0, duration: 0.25, ease: "power1.in" }, 1.9);

      /* ── Scene 2 (1.6–8.2s): 7 rows, one per beat; ✓ self-draw + badge flip + fill ── */
      var rows = document.querySelectorAll("#f05-rows .f05-row");
      var BEAT = 0.94;
      var checkBeats = [];
      for (var i = 0; i < rows.length; i++) {
        var t0 = 1.6 + i * BEAT;
        var row = rows[i];
        var badge = row.querySelector(".f05-badge");
        var path = row.querySelector(".f05-check-path");
        var tCheck = t0 + 0.35;
        checkBeats.push(tCheck + 0.3);

        /* staggered reveal of the row */
        tl.fromTo(row, { autoAlpha: 0, x: -26 }, { autoAlpha: 1, x: 0, duration: 0.4, ease: "power3.out" }, t0);

        /* SVG self-draw check */
        var len = path.getTotalLength();
        path.style.strokeDasharray = len;
        tl.fromTo(
          path,
          { strokeDashoffset: len },
          { strokeDashoffset: 0, duration: 0.42, ease: "power2.inOut" },
          tCheck
        );

        /* badge flip to solid cobalt */
        tl.to(badge, { scaleY: 0, duration: 0.12, ease: "power2.in" }, tCheck);
        tl.set(badge, { backgroundColor: INK, color: PAPER }, tCheck + 0.12);
        tl.to(badge, { scaleY: 1, duration: 0.18, ease: "back.out(2)" }, tCheck + 0.12);

        /* thin progress fill advances 1/7 → 7/7 (stat-bars-and-fills, scaleX only) */
        tl.to("#f05-fill", { scaleX: (i + 1) / 7, duration: 0.34, ease: "power2.out" }, tCheck + 0.05);
      }

      /* row 3 sub-text lands on its own cue */
      tl.fromTo("#f05-sub3", { autoAlpha: 0, y: 6 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power2.out" }, 4.05);

      /* n/7 counter — pure function of timeline time (seek-safe both directions) */
      var countEl = document.getElementById("f05-count");
      var cdrv = { t: 0 };
      tl.to(
        cdrv,
        {
          t: 10,
          duration: 10,
          ease: "none",
          onUpdate: function () {
            var n = 0;
            for (var k = 0; k < checkBeats.length; k++) {
              if (cdrv.t >= checkBeats[k]) n++;
            }
            countEl.textContent = n + "/7";
          },
        },
        0
      );

      /* ── Scene 3 (8.2–10s): seal spring-pop + ambient glow bloom, then hold ── */
      tl.fromTo(
        "#f05-glow",
        { opacity: 0, scale: 0.85 },
        { opacity: 0.28, scale: 1, duration: 0.7, ease: "power2.out" },
        8.22
      );
      tl.fromTo(
        "#f05-stamp",
        { autoAlpha: 0, scale: 0.55, rotation: -12 },
        { autoAlpha: 1, scale: 1, rotation: -4, duration: 0.65, ease: "back.out(1.6)" },
        8.28
      );
      /* quiet settle: nothing exits — hold to the cut */
    })();
  </script>
