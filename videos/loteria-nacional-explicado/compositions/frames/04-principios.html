  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      /* ---- build the QR mosaic from a fixed pattern (deterministic) ---- */
      var QR =
        "1110010101001101" +
        "1011100100110110" +
        "0101101101011001" +
        "1100110010110100" +
        "1001011011001011";
      /* 8x8 = 64 cells; reuse first 64 chars of the fixed string */
      var qrHost = document.getElementById("pri04-qr");
      for (var q = 0; q < 64; q++) {
        var cell = document.createElement("div");
        cell.className = QR[q] === "1" ? "pri04-qr-cell-on" : "pri04-qr-cell-off";
        qrHost.appendChild(cell);
      }

      /* ---- svg self-draw setup: measure each badge rect (svg-path-draw) ---- */
      var rects = document.querySelectorAll(".pri04-badge-rect");
      rects.forEach(function (r) {
        var len = r.getTotalLength() * 1.02;
        r.style.strokeDasharray = String(len);
        r.style.strokeDashoffset = String(len);
      });

      /* ---- dynamic-content-sequencing: card start times computed from body length ---- */
      var CARDS_AT = 1.4; /* Scene 2 opens */
      var BASE_DURATION = 1.05;
      var SEC_PER_CHAR = 0.008;
      var CONTENT = [
        { sel: "#pri04-card1", body: "nada se borra todo con SHA-256" },
        { sel: "#pri04-card2", body: "0 filas = alerta" },
        { sel: "#pri04-card3", body: "desde el archivo" },
      ];
      var cumulative = CARDS_AT;
      var TIMELINE = CONTENT.map(function (entry) {
        var dur = BASE_DURATION + entry.body.length * SEC_PER_CHAR;
        var start = cumulative;
        cumulative += dur;
        return { sel: entry.sel, start: start };
      });

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      /* =========== Scene 1 (0.0-1.4s): frame furniture + per-word headline =========== */

      /* slow macro push-in under the whole shot */
      tl.fromTo(
        ".pri04-content",
        { scale: 1 },
        { scale: 1.025, duration: 8, ease: "none" },
        0
      );

      /* hairlines draw across */
      tl.fromTo(
        "#pri04-hl-top",
        { scaleX: 0, transformOrigin: "0% 50%" },
        { scaleX: 1, duration: 0.7, ease: "power3.out" },
        0
      );
      tl.fromTo(
        "#pri04-hl-bot",
        { scaleX: 0, transformOrigin: "100% 50%" },
        { scaleX: 1, duration: 0.7, ease: "power3.out" },
        0.08
      );

      /* mono chrome fades */
      tl.fromTo(
        ["#pri04-ch-tl", "#pri04-ch-tr", "#pri04-ch-bl", "#pri04-ch-br"],
        { opacity: 0 },
        { opacity: 1, duration: 0.5, ease: "power1.out", stagger: 0.06 },
        0.25
      );

      /* QR cells shimmer in */
      var qrCells = gsap.utils.toArray("#pri04-qr div");
      qrCells.forEach(function (c, i) {
        tl.fromTo(
          c,
          { opacity: 0 },
          { opacity: 1, duration: 0.25, ease: "power1.out" },
          0.35 + (i % 16) * 0.03
        );
      });

      /* kicker */
      tl.fromTo(
        "#pri04-kicker",
        { opacity: 0, y: 12 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
        0.1
      );

      /* headline per-word reveal — masked rise, hero visible well before 0.5s */
      var words = gsap.utils.toArray(".pri04-w");
      words.forEach(function (w, i) {
        tl.fromTo(
          w,
          { yPercent: 112, opacity: 0 },
          { yPercent: 0, opacity: 1, duration: 0.62, ease: "power3.out" },
          0.15 + i * 0.1
        );
      });

      /* =========== Scene 2 (1.4-5.4s): staggered cascade of the three cards =========== */

      TIMELINE.forEach(function (item) {
        var s = item.start;
        var card = item.sel;

        /* spring-pop-entrance: scale 0 -> 1, smooth power3 settle, no overshoot */
        tl.fromTo(
          card,
          { scale: 0, opacity: 0, y: 26 },
          { scale: 1, opacity: 1, y: 0, duration: 0.55, ease: "power3.out" },
          s
        );

        /* badge square self-draws (stroke-dashoffset -> 0) */
        tl.to(card + " .pri04-badge-rect", {
          strokeDashoffset: 0,
          duration: 0.5,
          ease: "power2.out",
        }, s + 0.22);

        /* numeral fills after the stroke lands */
        tl.to(card + " .pri04-badge-num", {
          fillOpacity: 1,
          duration: 0.3,
          ease: "power1.out",
        }, s + 0.62);

        /* underline rule draws */
        tl.fromTo(
          card + " .pri04-under",
          { scaleX: 0 },
          { scaleX: 1, duration: 0.4, ease: "power3.out" },
          s + 0.45
        );

        /* body line rises in */
        tl.fromTo(
          card + " .pri04-body",
          { opacity: 0, y: 14 },
          { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
          s + 0.5
        );

        /* highlight sweep on the keyword: cobalt block sweeps, text flips to paper */
        tl.fromTo(
          card + " .pri04-hl-bg",
          { scaleX: 0, transformOrigin: "0% 50%" },
          { scaleX: 1, duration: 0.45, ease: "power3.out" },
          s + 0.58
        );
        tl.to(card + " .pri04-hl-tx", {
          color: "#F0EBDE",
          duration: 0.22,
          ease: "power1.out",
        }, s + 0.7);
      });

      /* =========== Scene 3 (5.4-8.0s): RESPIRO — held frame, minimal jitter on the underlines =========== */

      gsap.utils.toArray(".pri04-under").forEach(function (u, i) {
        tl.to(
          u,
          {
            keyframes: [
              { scaleX: 1.06, duration: 0.55 },
              { scaleX: 0.97, duration: 0.55 },
              { scaleX: 1.03, duration: 0.55 },
              { scaleX: 1, duration: 0.6 },
            ],
            ease: "sine.inOut",
          },
          5.5 + i * 0.12
        );
      });

      window.__timelines["04-principios"] = tl;
    })();
  </script>
