  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });
      window.__timelines["02-problema"] = tl;

      /* ---------- macro move: slow grid push across the whole shot ---------- */
      tl.fromTo("#f02-bg", { scale: 1 }, { scale: 1.03, duration: 8, ease: "none" }, 0);

      /* ---------- furniture ---------- */
      tl.fromTo("#f02-kicker", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out" }, 0.1);

      /* =========================================================
         Scene 1 (0.0-1.8): beat 1 per-word staggered reveal
         + ficha SVG self-draw (svg-path-draw)
         ========================================================= */
      tl.fromTo(".f02-b1-ord", { opacity: 0 }, { opacity: 0.7, duration: 0.3, ease: "power1.out" }, 0.12);

      var b1Words = gsap.utils.toArray(".f02-b1-w");
      b1Words.forEach(function (w, i) {
        tl.fromTo(w,
          { y: 44, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
          0.15 + i * 0.09);
      });

      /* ficha self-draw: measured lengths, staggered ~75% overlap */
      var drawIds = ["#f02-doc-outline", "#f02-doc-fold", "#f02-doc-l1", "#f02-doc-l2", "#f02-doc-l3"];
      var drawStarts = [0.45, 0.85, 1.05, 1.2, 1.35];
      var drawDurs = [0.55, 0.35, 0.25, 0.25, 0.22];
      drawIds.forEach(function (sel, i) {
        var p = document.querySelector(sel);
        var len = p.getTotalLength() * 1.05;
        p.style.strokeDasharray = String(len);
        p.style.strokeDashoffset = String(len);
        tl.to(sel, { strokeDashoffset: 0, duration: drawDurs[i], ease: "power2.out" }, drawStarts[i]);
      });
      tl.fromTo(".f02-ficha-label", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power1.out" }, 1.3);

      /* =========================================================
         Seam S1->S2 (waterfall cut, cut-catalog):
         beat-1 words rip left (power4.in) with early fades
         ========================================================= */
      b1Words.forEach(function (w, i) {
        var t0 = 1.5 + i * 0.022;
        tl.to(w, { x: -230, duration: 0.34, ease: "power4.in" }, t0);
        tl.to(w, { opacity: 0, duration: 0.18, ease: "power1.in" }, t0);
      });
      tl.to(".f02-b1-ord", { opacity: 0, duration: 0.15, ease: "power1.in" }, 1.6);

      /* =========================================================
         Scene 2 (1.8-3.6): beat 2 waterfall entry (mirrored back half)
         + ficha degrades: dims and gets marker-scribbled out
         ========================================================= */
      var b2Words = gsap.utils.toArray(".f02-b2-w");
      /* pre-set so un-started words never sit visible at rest */
      gsap.set(b2Words, { x: 230, opacity: 0 });
      var d = 0, gap = 0.05;
      b2Words.forEach(function (w) {
        tl.fromTo(w,
          { x: 230, opacity: 0.35 },
          { x: 0, opacity: 1, duration: 0.3, ease: "power4.out", immediateRender: false },
          1.82 + d);
        d += gap;
        gap *= 0.84;
      });
      tl.fromTo(".f02-b2-ord", { opacity: 0 }, { opacity: 0.7, duration: 0.25, ease: "power1.out" }, 1.9);

      /* ficha degrade: dim + scribble strike (css-marker-patterns, scribble mode) */
      tl.to("#f02-ficha-doc svg:first-child", { opacity: 0.35, duration: 0.4, ease: "power1.inOut" }, 2.0);
      tl.to(".f02-ficha-label", { opacity: 0.4, duration: 0.4, ease: "power1.inOut" }, 2.0);
      ["#f02-scr-1", "#f02-scr-2"].forEach(function (sel, i) {
        var p = document.querySelector(sel);
        var len = p.getTotalLength();
        gsap.set(p, { strokeDasharray: len, strokeDashoffset: len });
        tl.to(sel, { strokeDashoffset: 0, duration: 0.55, ease: "power1.inOut" }, 2.15 + i * 0.4);
      });

      /* =========================================================
         Scene 3 (3.6-5.6): hard-cut word-swap (discrete): beat 3 is
         gated in instantly by its clip window - no smear, no tween.
         Badge "0 bytes" stamps in on its cue.
         ========================================================= */
      tl.fromTo("#f02-badge",
        { opacity: 0, scale: 1.18 },
        { opacity: 1, scale: 1, duration: 0.2, ease: "power2.out" },
        4.4);

      /* pre-cut recede (inverse zoom-through exit): beat 3 pulls away */
      tl.to("#f02-b3-inner", { scale: 0.85, filter: "blur(10px)", duration: 0.2, ease: "power3.in" }, 5.4);
      tl.to("#f02-b3-inner", { opacity: 0.15, duration: 0.2, ease: "none" }, 5.4);

      /* =========================================================
         Scene 4 (5.6-8.0): beat 4 arrives oversized (inverse
         zoom-through entry), then "nadie" gets the cobalt keyword
         glow (asr-keyword-glow envelope). Quiet hold to the end -
         no exit: the root crossfade owns it.
         ========================================================= */
      tl.fromTo("#f02-b4-inner",
        { scale: 1.22, opacity: 0.15, filter: "blur(10px)" },
        { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.55, ease: "expo.out" },
        5.62);

      /* keyword glow: single linear driver, ASR envelope on "nadie" */
      var nadieEl = document.getElementById("f02-nadie");
      var GLOW_START = 0.85, GLOW_END = 1.35;   /* local to the 5.6s window */
      var ATTACK = 0.22, RELEASE = 0.45, REST = 0.28;
      var MAX_BLUR = 26, MAX_SCALE = 0.1;
      var glowDriver = { t: 0 };
      tl.to(glowDriver, {
        t: 2.4,
        duration: 2.4,
        ease: "none",
        onUpdate: function () {
          var t = glowDriver.t;
          var env;
          if (t < GLOW_START) env = 0;
          else if (t < GLOW_END) env = Math.min((t - GLOW_START) / ATTACK, 1);
          else if (t < GLOW_END + RELEASE) env = 1 - ((t - GLOW_END) / RELEASE) * (1 - REST);
          else env = REST;
          nadieEl.style.textShadow = "0 0 " + (MAX_BLUR * env) + "px rgba(31,43,224," + (0.85 * env) + ")";
          nadieEl.style.transform = "scale(" + (1 + MAX_SCALE * env) + ")";
        }
      }, 5.6);
    })();
  </script>
