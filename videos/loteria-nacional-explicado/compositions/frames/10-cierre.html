  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      // deterministic hand-authored 8x8 QR mosaic (1 = ink on, 0 = 10% off)
      var qrBits =
        "1110011110100101001110101101011101011010101110010100101111100111";
      var qrEl = document.getElementById("c10-qr");
      if (qrEl && qrEl.childElementCount === 0) {
        for (var i = 0; i < 64; i++) {
          var cell = document.createElement("span");
          cell.className =
            qrBits.charAt(i) === "1" ? "c10-qr-cell-on" : "c10-qr-cell-off";
          qrEl.appendChild(cell);
        }
      }

      var tl = gsap.timeline({ paused: true });

      /* ---- Scene 1 (0.0–2.4s): callback + strike, then the thesis lands ---- */
      // ground settles in with the crossfade-in
      tl.fromTo(
        "#c10-hair-top, #c10-hair-bottom",
        { scaleX: 0, transformOrigin: "left center" },
        { scaleX: 1, duration: 0.5, ease: "power2.out" },
        0.0
      );
      // hook question reappears, small and faint
      tl.fromTo(
        "#c10-hook",
        { opacity: 0, y: 14 },
        { opacity: 0.85, y: 0, duration: 0.45, ease: "power2.out" },
        0.15
      );
      // cobalt marker scribble strikes it through (css-marker-patterns, scribble/strikethrough)
      var scribble = document.getElementById("c10-scribble");
      var len = scribble.getTotalLength();
      gsap.set(scribble, { strokeDasharray: len, strokeDashoffset: len });
      tl.to(
        scribble,
        { strokeDashoffset: 0, duration: 0.7, ease: "power1.inOut" },
        0.85
      );
      // struck line recedes slightly once crossed out
      tl.to("#c10-hook", { opacity: 0.4, duration: 0.5, ease: "power1.out" }, 1.6);
      // thesis: ONE contained move — slide-up + crossfade
      tl.fromTo(
        "#c10-thesis",
        { opacity: 0, y: 54 },
        { opacity: 1, y: 0, duration: 1.1, ease: "power3.out" },
        0.85
      );

      /* ---- Scene 2 (2.4–4.6s): descargo reveals on its beat ---- */
      tl.fromTo(
        "#c10-descargo",
        { opacity: 0, y: 18 },
        { opacity: 1, y: 0, duration: 0.75, ease: "power2.out" },
        2.55
      );

      /* ---- Scene 3 (4.6–7.0s): serene lockup crossfade, absolute hold ---- */
      tl.fromTo(
        "#c10-lockup",
        { opacity: 0 },
        { opacity: 1, duration: 0.9, ease: "power1.inOut" },
        4.7
      );
      // QR cells settle in with a quiet micro-stagger inside the crossfade
      tl.fromTo(
        "#c10-qr span",
        { opacity: 0 },
        { opacity: 1, duration: 0.35, ease: "none", stagger: 0.008 },
        4.75
      );

      // the only real exit in the video: fade to cream field, last 0.4s
      tl.to(
        "#c10-fadeout",
        { opacity: 1, duration: 0.4, ease: "power1.inOut" },
        6.6
      );

      window.__timelines = window.__timelines || {};
      window.__timelines["10-cierre"] = tl;
    })();
